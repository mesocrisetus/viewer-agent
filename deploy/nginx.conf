server {
    listen 80;
    server_name ${PANEL_SERVER_NAME};

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    # DNS interno de Docker. Al usar una VARIABLE en proxy_pass (ver abajo),
    # nginx vuelve a resolver la IP del contenedor "server" en cada petición
    # (cada 10s como mucho). Así, cuando "docker compose up --build" recrea el
    # contenedor del servidor y le cambia la IP, nginx lo sigue solo y no hay
    # que reiniciarlo. Sin esto, nginx cachea la IP al arrancar y da 502 tras
    # cada redespliegue del servidor.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Panel (SPA): cualquier ruta desconocida cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Exportación de vídeo del día: ffmpeg puede tardar; timeout largo y sin buffer.
    location ~ ^/api/devices/[^/]+/video$ {
        set $upstream http://server:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    # API del panel y de ingesta del agente
    location /api/ {
        set $upstream http://server:8080;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /agent/ {
        set $upstream http://server:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    location /download/ {
        set $upstream http://server:8080;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health {
        set $upstream http://server:8080;
        proxy_pass $upstream;
    }

    # WebSocket del panel (vídeo en vivo)
    location /ws/ {
        set $upstream http://server:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
