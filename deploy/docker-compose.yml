services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Tope de memoria: si algo se desmadra, Docker reinicia SOLO este contenedor
    # en vez de arrastrar a toda la VM a swap (que fue lo que pasó).
    mem_limit: ${DB_MEM_LIMIT:-1g}
    memswap_limit: ${DB_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PANEL_ORIGIN: ${PANEL_ORIGIN}
      PORT: ${PORT}
      HOST: ${HOST}
      DATA_DIR: /data
      AGENT_DIST_DIR: /agent
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # Capturas procesadas a la vez (pico de RAM lineal con este número).
      SCREENSHOT_CONCURRENCY: ${SCREENSHOT_CONCURRENCY:-3}
      # Mantiene a raya el heap de V8; la memoria de sharp/libvips es nativa y
      # la acota el portero de concurrencia + mem_limit, no esta opción.
      NODE_OPTIONS: "--max-old-space-size=1024"
    # Tope duro de memoria del contenedor. Con 8 GB en la VM: ~2 GB al servidor,
    # ~1 GB a la BD, resto para SO + nginx + margen.
    mem_limit: ${SERVER_MEM_LIMIT:-2g}
    memswap_limit: ${SERVER_MEM_LIMIT:-2g}
    volumes:
      # Las capturas viven en el host, fuera de cualquier imagen: sobreviven a
      # cada actualización del servicio.
      - ./data:/data
      # Código/binarios del agente que se ofrecen en la página de descargas.
      - ../agent:/agent:ro

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.panel
    restart: unless-stopped
    depends_on:
      - server
    environment:
      PANEL_SERVER_NAME: ${PANEL_SERVER_NAME}
    ports:
      # Puerto de acceso al panel y a los agentes. Poco común a propósito para no
      # chocar con nada. Cámbialo en deploy/.env con HTTP_PORT. Ábrelo en el
      # firewall (TCP entrante).
      - "${HTTP_PORT:-8471}:80"
    # Para HTTPS: monta aquí tus certificados y añade el bloque 443 en nginx.conf,
    # o pon este servicio detrás de un proxy TLS (Caddy, Traefik, el de tu balanceador).
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro

volumes:
  db-data:
